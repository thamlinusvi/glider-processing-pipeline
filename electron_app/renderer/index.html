<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UVI Glider Pipeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ── Sidebar ───────────────────────────────────────────────── -->
    <nav id="sidebar">
      <div class="brand">
        <div class="brand-title">UVI Glider</div>
        <div class="brand-sub">PROCESSING PIPELINE</div>
      </div>

      <div class="dep-section">
        <div class="dep-label">DEPLOYMENT</div>
        <div class="dep-select-row">
          <select id="dep-select"></select>
        </div>
        <div class="dep-action-row">
          <button id="dep-nickname-btn" title="Set short name"   disabled>Set nickname</button>
          <button id="dep-rename-btn"   title="Rename deployment" disabled>Rename</button>
        </div>
        <div id="dep-nickname-lbl" class="dep-nickname-lbl hidden"></div>
        <div id="dep-nickname-form" class="dep-rename-form hidden">
          <input id="dep-nickname-input" type="text" class="dep-rename-input" placeholder="Short name (or blank to clear)" />
          <div class="dep-rename-btns">
            <button id="dep-nickname-save"   class="dep-rename-save">Save</button>
            <button id="dep-nickname-cancel" class="dep-rename-cancel">Cancel</button>
          </div>
        </div>
        <div id="dep-rename-form" class="dep-rename-form hidden">
          <input id="dep-rename-input" type="text" class="dep-rename-input" />
          <div class="dep-rename-btns">
            <button id="dep-rename-save"   class="dep-rename-save">Save</button>
            <button id="dep-rename-cancel" class="dep-rename-cancel">Cancel</button>
          </div>
        </div>
      </div>

      <ul id="nav-list">
        <li data-page="dashboard"   class="nav-item active">Dashboard</li>
        <li data-page="metadata"    class="nav-item">Metadata</li>
        <li data-page="qc-config"   class="nav-item">QC Config</li>
        <li data-page="pipeline"    class="nav-item">Pipeline</li>
        <li data-page="logs"        class="nav-item">Logs</li>
        <li data-page="reports"     class="nav-item">Reports</li>
        <li data-page="dat-browser" class="nav-item">Files</li>
        <li data-page="cloud"       class="nav-item">☁ Cloud</li>
        <li data-page="adcp"        class="nav-item">AD2CP</li>
        <li data-page="settings"    class="nav-item">Settings</li>
      </ul>

      <div class="sidebar-footer">
        <div class="footer-label">PIPELINE ROOT</div>
        <div id="base-dir-lbl" class="footer-path">—</div>
      </div>
    </nav>

    <!-- ── Content pages ─────────────────────────────────────────── -->
    <main id="content">
      <div id="page-dashboard"   class="page active"></div>
      <div id="page-pipeline"    class="page"></div>
      <div id="page-logs"        class="page"></div>
      <div id="page-reports"     class="page"></div>
      <div id="page-metadata"    class="page"></div>
      <div id="page-qc-config"   class="page"></div>
      <div id="page-dat-browser" class="page"></div>
      <div id="page-cloud"       class="page"></div>
      <div id="page-adcp"        class="page"></div>
      <div id="page-settings"    class="page"></div>
    </main>

  </div>
  <script src="app.js"></script>
</body>
</html>
