contexts:
  - priority: 2
    region: usvi
    window:
      starting: 2020-01-01T00:00:00
      ending: 2030-12-31T23:59:59.999999
    streams:
      temperature:
        qartod:
          climatology_test:
            suspect_span: [4.5, 31]
            fail_span: [4, 32]
          spike_test:
            suspect_threshold: 0.2
            fail_threshold: 1.0
          rate_of_change_test:
            threshold: 1.0

      conductivity:
        qartod:
          climatology_test:
            suspect_span: [3.1, 6.2]
            fail_span: [3, 6.5]
          spike_test:
            suspect_threshold: 0.01
            fail_threshold: 0.1
          rate_of_change_test:
            threshold: 0.2

      salinity:
        qartod:
          climatology_test:
            suspect_span: [32, 38.0]
            fail_span: [30, 38.5]
          spike_test:
            suspect_threshold: 0.01
            fail_threshold: 0.2
          rate_of_change_test:
            threshold: 0.2

      pressure:
        qartod:
          pressure_test:
            suspect_threshold: 0
          spike_test:
            suspect_threshold: 0.3
            fail_threshold: 0.5
          rate_of_change_test:
            threshold: 0.5

      # sci_water_pressure: raw RBR pressure in bar (gncutils naming).
      # Thresholds are pressure stream values scaled ÷10 for bar units.
      sci_water_pressure:
        qartod:
          pressure_test:
            suspect_threshold: 0
          spike_test:
            suspect_threshold: 0.03
            fail_threshold: 0.05
          rate_of_change_test:
            threshold: 0.05

      density:
        qartod:
          climatology_test:
            suspect_span: [1017, 1034]
            fail_span: [1015, 1035]
          spike_test:
            suspect_threshold: 0.025
            fail_threshold: 0.3
          rate_of_change_test:
            threshold: 0.5

      oxygen_concentration:
        qartod:
          gross_range_test:
            suspect_span: [100, 300]
            fail_span: [0, 500]
          flat_line_test:
            tolerance: 1
            suspect_threshold: 120
            fail_threshold: 300

      oxygen_saturation:
        qartod:
          gross_range_test:
            suspect_span: [50, 110]
            fail_span: [0, 120]
          flat_line_test:
            tolerance: 0.4
            suspect_threshold: 120
            fail_threshold: 300

      pH:
        qartod:
          gross_range_test:
            suspect_span: [6.5, 9]
            fail_span: [5, 10]
          spike_test:
            suspect_threshold: 0.05
            fail_threshold: 0.2
